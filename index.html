<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ayrin Ann</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --noir: #170a11;
    --wine: #3a1024;
    --plum: #5c2b45;
    --rosegold: #c98d87;
    --champagne: #e3c491;
    --blush: #f6e2e0;
    --ivory: #faf6f1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--noir);
    overflow: hidden;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 28%, var(--wine) 0%, var(--noir) 55%, #0c0509 100%);
  }

  /* ---- ambient silk-light blooms ---- */
  .bloom {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    will-change: transform;
    z-index: 0;
  }
  .bloom-1 {
    width: 46vmax; height: 46vmax;
    top: -14vmax; left: -12vmax;
    background: radial-gradient(circle at 35% 35%, var(--rosegold), transparent 70%);
    opacity: 0.32;
    animation: drift1 28s ease-in-out infinite;
  }
  .bloom-2 {
    width: 50vmax; height: 50vmax;
    bottom: -18vmax; right: -14vmax;
    background: radial-gradient(circle at 60% 60%, var(--plum), transparent 70%);
    opacity: 0.4;
    animation: drift2 34s ease-in-out infinite;
  }
  .bloom-3 {
    width: 24vmax; height: 24vmax;
    top: 38%; left: 44%;
    background: radial-gradient(circle at 50% 50%, var(--champagne), transparent 70%);
    opacity: 0.16;
    animation: drift1 24s ease-in-out infinite reverse;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(2.5vw, 2vh) scale(1.05); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-2vw, -2.5vh) scale(1.04); }
  }

  /* ---- fine grain overlay ---- */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image: radial-gradient(var(--blush) 1px, transparent 1px);
    background-size: 30px 30px;
    opacity: 0.05;
    mix-blend-mode: overlay;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(8, 4, 8, 0.6) 100%);
  }

  /* ---- falling petals ---- */
  .petal {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }
  .petal svg { display: block; }
  .petal-1 { top: 18%; left: 12%; width: 13px; color: var(--rosegold); opacity: 0.4; animation: fall 15s ease-in-out infinite; }
  .petal-2 { top: 64%; right: 14%; width: 10px; color: var(--champagne); opacity: 0.35; animation: fall 12s ease-in-out infinite 2s; }
  .petal-3 { top: 30%; right: 22%; width: 9px; color: var(--blush); opacity: 0.3; animation: fall 18s ease-in-out infinite 4s; }

  @keyframes fall {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50%      { transform: translate(-0.6em, 1.4em) rotate(50deg); }
  }

  /* ---- monogram crest ---- */
  .crest {
    position: relative;
    z-index: 4;
    width: clamp(52px, 7vw, 70px);
    height: clamp(52px, 7vw, 70px);
    margin-bottom: clamp(1.4rem, 4vw, 2.2rem);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .crest::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px dashed var(--rosegold);
    opacity: 0.4;
    animation: spin-slow 90s linear infinite;
  }
  .crest-inner {
    width: 78%;
    height: 78%;
    border-radius: 50%;
    border: 1px solid var(--champagne);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(0.7rem, 1.6vw, 0.9rem);
    letter-spacing: 0.3em;
    color: var(--champagne);
    padding-left: 0.3em;
  }

  @keyframes spin-slow {
    to { transform: rotate(360deg); }
  }

  /* ---- hairline dividers ---- */
  .divider {
    position: relative;
    z-index: 4;
    width: 68px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--champagne), transparent);
    margin: clamp(0.9rem, 2.6vw, 1.5rem) 0;
  }
  .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    background: var(--champagne);
    transform: translate(-50%, -50%) rotate(45deg);
  }

  /* ---- the name ---- */
  .stage {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 6vw;
  }

  h1.name {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    line-height: 1;
    text-align: center;
  }

  .first {
    font-style: italic;
    font-weight: 500;
    font-size: clamp(3.4rem, 13vw, 8.4rem);
    color: var(--blush);
  }

  @supports (background-clip: text) or (-webkit-background-clip: text) {
    .first {
      color: transparent;
      background-image: linear-gradient(100deg, var(--blush) 42%, var(--ivory) 50%, var(--blush) 58%);
      background-size: 240% 100%;
      background-position: 200% 0;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shimmer 7s ease-in-out infinite;
    }
  }

  @keyframes shimmer {
    0%, 20% { background-position: 200% 0; }
    60%, 100% { background-position: -40% 0; }
  }

  a.last {
    position: relative;
    margin-top: 0.7em;
    color: var(--rosegold);
    text-decoration: none;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(0.95rem, 2.4vw, 1.3rem);
    letter-spacing: 0.5em;
    padding-left: 0.5em;
    outline-offset: 8px;
    transition: color 0.4s ease, letter-spacing 0.4s ease;
  }

  a.last::after {
    content: '';
    position: absolute;
    left: 0.5em;
    right: 0;
    bottom: -0.5em;
    height: 1px;
    background: var(--champagne);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.5s ease;
  }

  a.last:hover,
  a.last:focus-visible {
    color: var(--blush);
    letter-spacing: 0.6em;
  }

  a.last:hover::after,
  a.last:focus-visible::after {
    transform: scaleX(1);
  }

  a.last:focus-visible {
    outline: 1px dashed var(--champagne);
  }

  /* ---- botanical flourish ---- */
  .flourish {
    position: relative;
    z-index: 4;
    width: 150px;
    color: var(--rosegold);
    opacity: 0.55;
    margin-top: clamp(0.6rem, 2vw, 1rem);
    animation: sway 10s ease-in-out infinite;
    transform-origin: 4px 54px;
  }
  .flourish svg { display: block; }

  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(2deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bloom, .petal, .crest::before, .first, a.last, .flourish { animation: none !important; }
  }

  @media (max-width: 420px) {
    .flourish { width: 110px; }
  }
</style>
</head>
<body>

  <div class="bloom bloom-1"></div>
  <div class="bloom bloom-2"></div>
  <div class="bloom bloom-3"></div>

  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="petal petal-1" aria-hidden="true">
    <svg viewBox="0 0 16 16" width="100%" fill="currentColor"><path d="M8,0 C14,4 14,12 8,16 C2,12 2,4 8,0 Z"/></svg>
  </div>
  <div class="petal petal-2" aria-hidden="true">
    <svg viewBox="0 0 16 16" width="100%" fill="currentColor"><path d="M8,0 C14,4 14,12 8,16 C2,12 2,4 8,0 Z"/></svg>
  </div>
  <div class="petal petal-3" aria-hidden="true">
    <svg viewBox="0 0 16 16" width="100%" fill="currentColor"><path d="M8,0 C14,4 14,12 8,16 C2,12 2,4 8,0 Z"/></svg>
  </div>

  <main class="stage">
    <div class="crest" aria-hidden="true">
      <div class="crest-inner">A·A</div>
    </div>

    <div class="divider"></div>

    <h1 class="name">
      <span class="first">Ayrin</span><a href="index-ayrin.html" class="last">ANN</a>
    </h1>

    <div class="divider"></div>

    <div class="flourish" aria-hidden="true">
      <svg viewBox="0 0 140 60" width="100%" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M4,54 C30,50 55,40 70,18" />
        <path d="M0,0 C4,-6 10,-6 14,0 C10,6 4,6 0,0 Z" transform="translate(18,47) rotate(-30) scale(0.9)"/>
        <path d="M0,0 C4,-6 10,-6 14,0 C10,6 4,6 0,0 Z" transform="translate(30,40) rotate(20) scale(0.8)"/>
        <path d="M0,0 C4,-6 10,-6 14,0 C10,6 4,6 0,0 Z" transform="translate(42,32) rotate(-25) scale(0.7)"/>
        <path d="M0,0 C4,-6 10,-6 14,0 C10,6 4,6 0,0 Z" transform="translate(54,25) rotate(15) scale(0.6)"/>
        <circle cx="72" cy="16" r="2.4" fill="currentColor" stroke="none"/>
      </svg>
    </div>
  </main>

</body>
</html>
