<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ayrin Ann</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: #ff3d81;
    --coral: #ff8452;
    --violet: #9a3ce0;
    --indigo: #4b2a8f;
    --gold: #ffcf4d;
    --cream: #fff6ea;
    --teal: #1ec9b7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0d0614;
    overflow: hidden;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ---- mesh-gradient blob background ---- */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.75;
    will-change: transform;
    z-index: 0;
  }
  .blob-1 {
    width: 55vmax; height: 55vmax;
    top: -18vmax; left: -14vmax;
    background: radial-gradient(circle at 30% 30%, var(--pink), transparent 70%);
    animation: float1 22s ease-in-out infinite;
  }
  .blob-2 {
    width: 60vmax; height: 60vmax;
    bottom: -22vmax; right: -18vmax;
    background: radial-gradient(circle at 60% 60%, var(--violet), transparent 70%);
    animation: float2 26s ease-in-out infinite;
  }
  .blob-3 {
    width: 40vmax; height: 40vmax;
    top: 10%; right: 5%;
    background: radial-gradient(circle at 50% 50%, var(--coral), transparent 70%);
    animation: float3 19s ease-in-out infinite;
  }
  .blob-4 {
    width: 34vmax; height: 34vmax;
    bottom: 5%; left: 8%;
    background: radial-gradient(circle at 50% 50%, var(--gold), transparent 70%);
    opacity: 0.5;
    animation: float1 24s ease-in-out infinite reverse;
  }
  .blob-5 {
    width: 26vmax; height: 26vmax;
    top: 42%; left: 46%;
    background: radial-gradient(circle at 50% 50%, var(--teal), transparent 70%);
    opacity: 0.35;
    animation: float3 30s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(6vw, 4vh) scale(1.1); }
    66%      { transform: translate(-4vw, 6vh) scale(0.92); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    40%      { transform: translate(-5vw, -6vh) scale(1.08); }
    75%      { transform: translate(4vw, -3vh) scale(0.95); }
  }
  @keyframes float3 {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    50%      { transform: translate(-6vw, 5vh) rotate(20deg) scale(1.12); }
  }

  /* ---- texture overlays: dot grid + diagonal stripes ---- */
  .pattern {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .pattern.dots {
    background-image: radial-gradient(var(--cream) 1.4px, transparent 1.4px);
    background-size: 34px 34px;
    opacity: 0.06;
    mix-blend-mode: overlay;
  }
  .pattern.stripes {
    background-image: repeating-linear-gradient(
      115deg,
      transparent 0 38px,
      rgba(255, 246, 234, 0.045) 38px 40px
    );
    z-index: 2;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(6, 3, 12, 0.65) 100%);
  }

  /* ---- scattered decorative art ---- */
  .deco {
    position: fixed;
    color: var(--gold);
    opacity: 0.65;
    z-index: 3;
    pointer-events: none;
  }
  .deco svg { display: block; }

  .spark-1 { top: 12%;  left: 10%;  width: 26px; animation: drift 9s ease-in-out infinite; }
  .spark-2 { top: 20%;  right: 13%; width: 18px; color: var(--cream); animation: drift 7s ease-in-out infinite 1s; }
  .spark-3 { bottom: 16%; left: 16%; width: 20px; color: var(--pink); animation: drift 11s ease-in-out infinite 0.5s; }
  .spark-4 { bottom: 22%; right: 11%; width: 30px; animation: drift 10s ease-in-out infinite 2s; }
  .spark-5 { top: 46%; left: 6%; width: 14px; color: var(--teal); animation: drift 8s ease-in-out infinite 1.5s; }

  .scallop {
    top: 8%; right: 7%;
    width: 92px;
    opacity: 0.35;
    animation: spin-slow 60s linear infinite;
  }
  .swash {
    bottom: 9%;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    opacity: 0.55;
  }

  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-16px) rotate(14deg); }
  }
  @keyframes spin-slow {
    to { transform: rotate(360deg); }
  }

  /* ---- the name ---- */
  .stage {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 6vw;
  }

  h1.name {
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 0.4em;
    font-family: 'Playfair Display', 'Didot', Georgia, serif;
    font-weight: 900;
    font-size: clamp(3.2rem, 13vw, 9.5rem);
    line-height: 1;
    letter-spacing: -0.01em;
    text-align: center;
  }

  .first {
    font-style: italic;
    color: var(--cream);
    text-shadow:
      0 0 40px rgba(255, 61, 129, 0.45),
      0 0 90px rgba(154, 60, 224, 0.35);
  }

  a.last {
    position: relative;
    color: var(--gold);
    text-decoration: none;
    font-style: italic;
    outline-offset: 10px;
    border-radius: 6px;
    background-image: linear-gradient(var(--pink), var(--pink));
    background-repeat: no-repeat;
    background-position: 0 92%;
    background-size: 0% 3px;
    transition: background-size 0.45s ease, color 0.35s ease, text-shadow 0.35s ease;
    text-shadow:
      0 0 30px rgba(255, 207, 77, 0.5),
      0 0 80px rgba(255, 132, 82, 0.3);
    animation: hop 5s ease-in-out infinite;
  }

  a.last:hover,
  a.last:focus-visible {
    color: var(--pink);
    background-size: 100% 3px;
    text-shadow:
      0 0 30px rgba(255, 61, 129, 0.65),
      0 0 90px rgba(255, 207, 77, 0.45);
    animation: hop-hover 0.9s ease-in-out infinite;
  }

  a.last:focus-visible {
    outline: 2px dashed var(--gold);
  }

  @keyframes hop {
    0%, 55%, 100% { transform: translateY(0) rotate(0deg); }
    8%            { transform: translateY(-0.22em) rotate(-5deg); }
    16%           { transform: translateY(0) rotate(3deg); }
    24%           { transform: translateY(-0.12em) rotate(-2deg); }
    32%           { transform: translateY(0) rotate(0deg); }
  }
  @keyframes hop-hover {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-0.2em) rotate(3deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob, .deco, a.last { animation: none !important; }
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="blob blob-5"></div>

  <div class="pattern dots"></div>
  <div class="pattern stripes"></div>
  <div class="vignette"></div>

  <div class="deco spark-1" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="100%" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0Z"/></svg>
  </div>
  <div class="deco spark-2" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="100%" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0Z"/></svg>
  </div>
  <div class="deco spark-3" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="100%" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0Z"/></svg>
  </div>
  <div class="deco spark-4" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="100%" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0Z"/></svg>
  </div>
  <div class="deco spark-5" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="100%" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0Z"/></svg>
  </div>

  <div class="deco scallop" aria-hidden="true">
    <svg viewBox="0 0 100 100" width="100%" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="50" cy="50" r="46" stroke-dasharray="3 9" />
      <circle cx="50" cy="50" r="34" />
    </svg>
  </div>

  <div class="deco swash" aria-hidden="true">
    <svg viewBox="0 0 220 40" width="100%" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M2 20c20-18 40-18 55 0s35 18 55 0 35-18 55 0 35 18 51 0" />
      <circle cx="110" cy="20" r="3" fill="currentColor" stroke="none" />
    </svg>
  </div>

  <main class="stage">
    <h1 class="name">
      <span class="first">Ayrin</span><a href="index-ayrin.html" class="last">Ann</a>
    </h1>
  </main>

</body>
</html>
